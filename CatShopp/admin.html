<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<link rel="icon" href="assets/icon.png" />
	<link rel="stylesheet" href="css/admin.css" />
	<link href="https://unpkg.com/boxicons@2.0.7/css/boxicons.min.css" rel="stylesheet" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Catshop Admin</title>
</head>

<body>
	<div class="sidebar">
		<div class="logo-details">
			<i class="bx bx-category"></i>
			<span class="logo_name">CatShop</span>
		</div>
		<ul class="nav-links">
			<li>
				<a href="#" class="active">
					<i class="bx bx-grid-alt"></i>
					<span class="links_name">Dashboard</span>
				</a>
			</li>
			<li>
				<a href="categories/categories.html">
					<i class="bx bx-box"></i>
					<span class="links_name">Categories</span>
				</a>
			</li>
			<li>
				<a href="transaction/transaction.html">
					<i class="bx bx-list-ul"></i>
					<span class="links_name">Transaction</span>
				</a>
			</li>
			<li>
				<a href="#">
					<i class="bx bx-log-out"></i>
					<span class="links_name">Log out</span>
				</a>
			</li>
		</ul>
	</div>
	<section class="home-section">
		<nav>
			<div class="sidebar-button">
				<i class="bx bx-menu sidebarBtn"></i>
			</div>
			<div class="profile-details">
				<span class="admin_name">Catshop Admin</span>
			</div>
		</nav>
		<div class="home-content">
			<h2 id="text"></h2>
			<h3 id="date"></h3>
		</div>
	</section>
	<script>
		<script>
  // Sidebar
  const sidebar = document.querySelector(".sidebar");
  const sidebarBtn = document.querySelector(".sidebarBtn");

  if (sidebar && sidebarBtn) {
    sidebarBtn.onclick = function () {
      sidebar.classList.toggle("active");
      if (sidebar.classList.contains("active")) {
        sidebarBtn.classList.replace("bx-menu", "bx-menu-alt-right");
      } else {
        sidebarBtn.classList.replace("bx-menu-alt-right", "bx-menu");
      }
    };
  }

  // Jam & Tanggal + Hari
  function myFunction() {
    const months = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
    const days = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
    
    const now = new Date();
    const jam = String(now.getHours()).padStart(2, '0');
    const tanggal = now.getDate();
    const hari = days[now.getDay()];
    const bulan = months[now.getMonth()];
    const tahun = now.getFullYear();
    let menit = String(now.getMinutes()).padStart(2, '0');
    let detik = String(now.getSeconds()).padStart(2, '0');

    const dateEl = document.getElementById("date");
    if (dateEl) {
      dateEl.textContent = `${hari}, ${tanggal} ${bulan} ${tahun}, ${jam}:${menit}:${detik}`;
    }
    
    setTimeout(myFunction, 1000);
  }

  // Sapaan
  window.addEventListener("load", function () {
    let nama = prompt("Masukkan Nama Anda : ", "Admin");
    if (!nama || nama.trim() === "") nama = "Admin";
    
    const jamSekarang = new Date().getHours();
    let sapa = "Malam";
    if (jamSekarang >= 4 && jamSekarang <= 10) sapa = "Pagi";
    else if (jamSekarang >= 11 && jamSekarang <= 14) sapa = "Siang";
    else if (jamSekarang >= 15 && jamSekarang <= 18) sapa = "Sore";

    const textEl = document.getElementById("text");
    if (textEl) {
      textEl.textContent = `Selamat ${sapa} ${nama}`;
    }
    
    myFunction();
  });
